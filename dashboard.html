<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LinkShield</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- ANNOUNCEMENT -->

<div id="announcementBar"
class="announcement-bar">

Memuat Announcement...

</div>

<!-- IKLAN -->

<div id="adsContainer"
class="ads-container">

Memuat Iklan...

</div>

<!-- TOPBAR -->

<header class="topbar">

<button
class="menu-btn"
onclick="openMenu()">

☰

</button>

<h2>

🛡️ LinkShield

</h2>

</header>

<!-- SIDEBAR -->

<div id="sidebar"
class="sidebar">

<h2>
⚙️ Menu
</h2>

<button onclick="changeUsername()">
👤 Ganti Username
</button>

<button onclick="changePassword()">
🔒 Ganti Password
</button>

<button onclick="logout()">
🚪 Logout
</button>

<button onclick="closeMenu()">
❌ Tutup
</button>

</div>

<!-- CONTENT -->

<div class="main-container">

<div class="scanner-card">

<h1>

🔍 Link Security Scanner

</h1>

<p>

Masukkan link yang ingin diperiksa.

</p>

<div class="input-box">

<input
type="text"
id="urlInput"
placeholder="https://example.com">

<button
onclick="scanLink()">

SCAN

</button>

</div>

<div id="result"
class="result-box">

Belum ada hasil scan

</div>

</div>

</div>

<script type="module"
src="dashboard.js"></script>

</body>

</html>
